<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} {% endblock title %}SWIFTBUY</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .top-navbar {
        background-color: #f2f2f2;
        padding: 15px 60px;
        border-bottom: 1px solid #ddd;
      }

      .brand-logo {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        color: black;
        line-height: 1.1;
      }

      .brand-logo span {
        display: block;
        font-size: 20px;
        font-weight: 700;
      }

      .nav-links a {
        text-decoration: none;
        color: #5b5249;
        font-size: 12px;
        font-weight: 700;
        margin: 0 20px;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: black;
      }

      .right-side {
        font-size: 15px;
        font-weight: 700;
        color: #222;
      }

      .menu-icon {
        font-size: 20px;
        margin-left: 15px;
        margin-right: -30px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <nav class="top-navbar d-flex justify-content-between align-items-center">
      <!-- Logo -->
      <div class="brand-logo">
        SWIFT
        <span>BUY</span>
      </div>

      <!-- Center Menu -->
      <div class="nav-links d-none d-lg-flex">
        <a href="#">HOME</a>
        <a href="#">ABOUT US</a>
        <a href="#">PRODUCTS</a>
        <a href="#">TESTIMONIALS</a>
        <a href="#">CONTACT</a>
      </div>

      <!-- Right Side -->
      <div class="d-flex align-items-center">
        <div class="right-side">
          <i class="bi bi-telephone"></i> +91 9876543210
        </div>
        <div class="menu-icon">
          <i class="bi bi-list"></i>
        </div>
      </div>
    </nav>
    {% block body %} {% endblock body %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
