<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SWIFTBUY - Login</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .brand-title {
            font-size: 32px;
            font-weight: bold;
            color: #0d6efd;
            text-align: center;
        }

        .brand-subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
        }

        .btn-login {
            width: 100%;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            font-size: 18px;
        }

        .extra-links {
            text-align: center;
            margin-top: 20px;
        }

        .extra-links a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: 500;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-title">SWIFTBUY</div>
        <p class="brand-subtitle">Welcome back! Login to continue shopping</p>

        <form>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your email"
                />
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    placeholder="Enter your password"
                />
            </div>

            <div class="d-flex justify-content-between mb-3">
                <div>
                    <input type="checkbox" />
                    <label>Remember me</label>
                </div>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-login">
                Login
            </button>
        </form>

        <div class="extra-links">
            <p class="mt-3">
                Don’t have an account?
                <a href="#">Sign Up</a>
            </p>
        </div>
    </div>

</body>
</html>
