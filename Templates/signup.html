
{% extends "base.html" %}

{% block body %}

<!-- Signup Form -->
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title mb-4">Create an Account</h3>
          <form method="post" action="{% url 'signup' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_username" class="form-label">Username</label>
              <input type="text" class="form-control" id="id_username" name="username" required>
            </div>
            <div class="mb-3">
              <label for="id_email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="id_email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="id_password" class="form-label">Password</label> 
                <input type="password" class="form-control" id="id_password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="id_confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="id_confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
          </form>
          <p class="mt-3 text-center">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>  

{% endblock body %}
